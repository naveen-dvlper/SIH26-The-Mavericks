    <script>
      // Defensive workaround: Some browser extensions or environment polyfills 
      // attempt to re-assign window.fetch in strict mode, crashing the app.
      // This setter safely intercepts those attempts without throwing an error.
      (function() {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return originalFetch; },
              set: function(newFetch) { 
                console.warn('Prevented third-party script from overriding window.fetch'); 
              }
            });
          } catch (e) {
            // Ignore if already non-configurable
          }
        }
      })();
    </script>
